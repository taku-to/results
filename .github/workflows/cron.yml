name: cron

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: cron-deploy-v2
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy-v2:
    name: Deploy scraper
    runs-on: ubuntu-24.04

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, json

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Scrape Data (v2)
        run: php scraper.php v2

      - name: Deploy JSON for scraper v2
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 変更がある場合のみコミットとプッシュを行う
          git add docs/v2/
          
          if ! git diff --cached --exit-code --quiet; then
            git commit -m "chore: deploy JSON files to docs/v2"
            
            # デフォルトブランチが gh-pages なのでここを修正
            git pull --rebase origin gh-pages -X theirs
            git push origin HEAD:gh-pages
          else
            echo "No JSON changes to commit."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
