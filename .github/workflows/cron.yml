name: cron

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: cron-deploy-v2
  cancel-in-progress: false # trueからfalseに変えることで、途中で殺されるのを防ぎます

permissions:
  contents: write

jobs:
  deploy-v2:
    name: Deploy scraper
    runs-on: ubuntu-24.04

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, json

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Rebaseを成功させるために全履歴を取得

      - name: Install dependencies
        run: |
          # 毎回remove/requireするのではなく、composer.lockに従ってインストール
          # (もしローカルでv5.0をrequire済みであれば、これだけで済みます)
          composer install --prefer-dist --no-interaction --no-progress

      - name: Scrape Data (v2)
        run: php scraper.php v2

      - name: Deploy JSON for scraper v2
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # フォルダが存在しない場合に備えて作成
          mkdir -p docs/v2
          
          # JSONファイルの変更をステージング
          git add docs/v2/*.json || true
          
          # 変更がある場合のみコミットとプッシュを行う
          if ! git diff --cached --exit-code --quiet; then
            git commit -m "chore: deploy JSON files to docs/v2"
            
            # 5分おきの実行による競合を防ぐため、最新を取り込んでからプッシュ
            git pull --rebase origin main -X theirs
            git push origin HEAD:main
          else
            echo "No JSON changes to commit."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
